<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="ログインすると生成履歴をいつでも確認できます。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef2ff" media="(prefers-color-scheme: light)">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5fff'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E就%3C/text%3E%3C/svg%3E">
<script>
(function(){try{var t=localStorage.getItem('shibou-theme');if(t!=='dark'&&t!=='light'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">本文へスキップ</a>
<header class="nav">
  <div class="wrap nav-inner">
    <div class="brand">就活AI<small>志望動機・自己PR・履歴書シリーズ</small></div>
    <nav class="nav-links">
      <a href="/">志望動機AI</a>
      <a href="/jiko-pr.html">自己PR</a>
      <a href="/rirekisho.html">履歴書</a>
      <a href="/shokumu.html">職務経歴書</a>
      <a href="/mensetsu.html">面接対策</a>
    </nav>
    <span class="auth-area" id="auth-area"></span>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="ダークモードに切替" title="配色を切替">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="main" class="wrap">
  <section class="hero">
    <h1>マイページ</h1>
    <p class="sub">ログインすると、これまでに生成した志望動機・自己PRなどの履歴をいつでも確認できます。</p>
  </section>

  <section class="section">
    <div class="card" id="account-view">
      <p class="muted">読み込み中…</p>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap">
    <div>就活AI — 志望動機シリーズ</div>
    <nav>
      <a href="/jiko-pr.html">自己PR</a>
      <a href="/rirekisho.html">履歴書</a>
      <a href="/shokumu.html">職務経歴書</a>
      <a href="/mensetsu.html">面接対策</a>
    </nav>
  </div>
</footer>

<script src="/assets/js/engine.js"></script>
<script>CareerAI.initTheme();</script>
<script>
  function fmtDate(ts) {
    try {
      var d = new Date(ts);
      var p = function (n) { return (n < 10 ? "0" : "") + n; };
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
    } catch (e) { return ""; }
  }
  function escapeHtml(s) {
    return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  async function renderAccount() {
    var view = document.getElementById("account-view");
    if (!view) return;
    var me;
    try {
      var r = await fetch("/api/auth");
      me = await r.json();
    } catch (e) { me = { loggedIn: false }; }

    if (!me.loggedIn) {
      if (me.configured === false) {
        view.innerHTML =
          '<p class="warn">現在ログイン機能を準備中です。ご利用いただけるまで今しばらくお待ちください。</p>' +
          '<p class="muted">ログインなしでも、各ツールは本日最大2回まで生成できます。</p>' +
          '<p><a class="btn block" href="/">ツールへ戻る</a></p>';
        return;
      }
      var lim = (window.CareerAI && CareerAI.auth && CareerAI.auth.limits) ? CareerAI.auth.limits() : { anon: 2, logged: 5 };
      var mailNote = (me.emailConfigured === false)
        ? '<p class="warn">現在メール送信が未設定のため、新規登録は利用できません（管理者へ連絡）。</p>'
        : '';
      view.innerHTML =
        mailNote +
        '<div class="promise no-print" role="note"><span class="check" aria-hidden="true">✓</span>' +
        '<span>生成履歴を保存・確認するにはログインしてください。</span></div>' +
        '<p class="muted">新規登録は<b>実際に受信できるメールアドレス</b>が必要です。送信された6桁の認証コードで本人確認します。ログインすると、1日の生成上限も' + lim.anon + '回から' + lim.logged + '回にアップします。</p>' +
        '<button type="button" class="btn block" id="goto-login">ログイン / 新規登録</button>';
      var b = document.getElementById("goto-login");
      if (b) b.addEventListener("click", function () { CareerAI.auth.openModal(); });
      return;
    }

    // ログイン中: 記録取得
    var html = '<div class="account-head no-print"><span>ログイン中：<strong>' + escapeHtml(me.email) + '</strong></span>' +
      '<button type="button" class="btn ghost mini" id="acc-logout">ログアウト</button>' +
      '<button type="button" class="btn ghost mini" id="acc-refresh">更新</button></div>';
    var recs;
    try {
      var rr = await fetch("/api/records");
      var rd = await rr.json();
      recs = rd.records || [];
    } catch (e) { recs = null; }

    if (recs === null) {
      html += '<p class="warn">履歴の取得に失敗しました（認証ストア未設定の可能性があります）。</p>';
    } else if (!recs.length) {
      html += '<p class="muted">まだ生成履歴がありません。ツールで生成すると、ここに保存されます。</p>';
    } else {
      html += '<p class="muted">生成履歴（' + recs.length + '件・新しい順）</p>';
      recs.forEach(function (rec) {
        var meta = [rec.toolLabel, rec.scene, rec.company, rec.len, rec.tone].filter(Boolean).join(" ・ ");
        html += '<article class="record">' +
          '<div class="record-meta"><span>' + escapeHtml(meta) + '</span><span class="record-time">' + fmtDate(rec.ts) + '</span></div>' +
          '<div class="doc record-text">' + escapeHtml(rec.text) + '</div>' +
          '</article>';
      });
    }
    view.innerHTML = html;
    var lo = document.getElementById("acc-logout");
    if (lo) lo.addEventListener("click", function () { CareerAI.auth.logout(); });
    var rf = document.getElementById("acc-refresh");
    if (rf) rf.addEventListener("click", renderAccount);
  }

  // ログイン状態変化時にマイページを再描画
  window.onAuthChange = function () { renderAccount(); };

  document.addEventListener("DOMContentLoaded", renderAccount);
  // engine.js の Auth.init は /api/auth を呼ぶが、描画はここで行う
  renderAccount();
</script>
</body>
</html>
